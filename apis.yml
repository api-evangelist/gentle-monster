name: Gentle Monster
description: 'Gentle Monster is a South Korean luxury eyewear brand founded in 2011 and operated
  by parent company IICOMBINED, headquartered in Seoul. The brand designs and sells avant-garde
  sunglasses and optical frames, and is widely recognized for its immersive, art-installation
  flagship stores and experiential retail spaces. Its sister brands include Tamburins (fragrance
  and body care) and Nudake (conceptual dessert and patisserie). Gentle Monster sells globally
  through flagship stores, department-store concessions, and its direct-to-consumer site at
  gentlemonster.com. It was surfaced as a portfolio company of IDG Capital and added to the API
  Evangelist network for enrichment; it is a consumer retail brand and publishes no public
  developer API surface at this time.'
